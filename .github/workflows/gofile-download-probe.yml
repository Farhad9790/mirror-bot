name: Gofile download probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests beautifulsoup4
      - name: Probe Gofile resolution and download
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
          GOFILE_WT_SALT: ${{ vars.GOFILE_WT_SALT }}
        run: |
          python - <<'PY'
          import concurrent.futures as cf
          import os
          import requests
          from mirror.resolver import Resolver

          code = "O7fKyZM9"
          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"}

          r = Resolver(gofile_token=os.getenv("GOFILE_TOKEN"))
          print("token_configured:", bool(os.getenv("GOFILE_TOKEN")))
          link = r.resolve(f"https://gofile.io/d/{code}")
          host = link.url.split("/")[2]
          print("resolved_host:", host)
          print("size:", link.size)
          print("auth_header:", bool(link.headers))

          def get(label, extra, range_value="bytes=0-1023"):
              h = dict(headers)
              h.update(extra or {})
              if range_value:
                  h["Range"] = range_value
              try:
                  resp = requests.get(link.url, headers=h, stream=True, allow_redirects=True, timeout=(20, 60))
                  info = {
                      "status": resp.status_code,
                      "server": resp.headers.get("server"),
                      "ctype": resp.headers.get("content-type"),
                      "clen": resp.headers.get("content-length"),
                      "retry_after": resp.headers.get("retry-after"),
                      "final_host": resp.url.split("/")[2] if "://" in resp.url else resp.url,
                  }
                  resp.close()
                  print(label, info)
                  return resp.status_code
              except Exception as exc:
                  print(label, "EXC", type(exc).__name__, str(exc)[:200])
                  return None

          auth = dict(link.headers or {})
          get("single_with_auth", auth)
          get("single_without_auth", None)
          get("head_with_auth", auth, None)

          def one(i):
              return get(f"parallel_{i}", auth)

          with cf.ThreadPoolExecutor(max_workers=4) as pool:
              print("parallel_statuses:", list(pool.map(one, range(4))))

          # Does the resolver itself get rate-limited when asked twice in a row?
          for i in range(2):
              try:
                  again = r.resolve(f"https://gofile.io/d/{code}")
                  print(f"resolve_again_{i}: ok size={again.size}")
              except Exception as exc:
                  print(f"resolve_again_{i}: EXC {type(exc).__name__}: {str(exc)[:300]}")
          PY
